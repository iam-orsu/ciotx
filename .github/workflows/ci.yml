name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Vet
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ciotx
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: ciotx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ciotx -d ciotx_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Server tests that need DB use this
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: ciotx
      POSTGRES_PASSWORD: testpassword
      POSTGRES_DB: ciotx_test
      # Prevent startup validation failure in tests
      LLM_API_KEY: sk-test
      MASTER_LICENSE_KEY: ciotx_ci_master_key_for_testing_only

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: |
            server/go.sum
            cli/go.sum

      - name: Vet — server
        working-directory: server
        run: go vet ./...

      - name: Vet — cli
        working-directory: cli
        run: go vet ./...

      - name: Test — server
        working-directory: server
        run: go test ./... -race -timeout 120s

      - name: Test — cli
        working-directory: cli
        run: go test ./... -race -timeout 60s

  build:
    name: Build (smoke test)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod

      - name: Build server
        working-directory: server
        run: CGO_ENABLED=0 go build -o /dev/null ./

      - name: Build CLI (linux/amd64)
        working-directory: cli
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /dev/null ./cmd/ciotx
