services:

  # ── PostgreSQL — License database ─────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ciotx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ciotx
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - ciotx-internal
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ciotx -d ciotx"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

  # ── ciotx API Server ───────────────────────────────────────────────
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - PORT=8080
      - LLM_API_KEY=${LLM_API_KEY}
      - MASTER_LICENSE_KEY=${MASTER_LICENSE_KEY}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=ciotx
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=ciotx
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      # GitHub App integration (Phase 6) — leave all three unset to disable.
      - GITHUB_APP_ID=${GITHUB_APP_ID:-}
      - GITHUB_APP_PRIVATE_KEY_BASE64=${GITHUB_APP_PRIVATE_KEY_BASE64:-}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:-}
    expose:
      - "8080"
    networks:
      - ciotx-internal
    depends_on:
      postgres:
        condition: service_healthy
    # Allow in-flight scans to complete during graceful shutdown
    stop_grace_period: 90s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 128M

  # ── Nginx Reverse Proxy (TLS termination, dynamic domain) ─────────
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Let's Encrypt certs — read-only for nginx
      # Bind mount matches the path deploy.sh writes to (./data/certbot/conf)
      - ./data/certbot/conf:/etc/letsencrypt:ro
      # ACME challenge webroot
      - ./data/certbot/www:/var/www/certbot
      # Generated install.sh (contains real DOMAIN_NAME, built by deploy.sh)
      - ./scripts/install.sh:/var/www/static/install.sh:ro
      # Pre-built CLI binaries served at /releases/
      - ./data/static/releases:/var/www/static/releases:ro
    networks:
      - ciotx-internal
    stop_grace_period: 30s
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  # ── Certbot (Let's Encrypt SSL — auto-renewal every 12h) ──────────
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
    # Checks every 12h; certbot only renews if expiry < 30 days
    entrypoint: >
      sh -c "trap exit TERM;
             while :; do
               certbot renew --webroot -w /var/www/certbot --quiet;
               sleep 12h & wait $${!};
             done"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M

# ── Volumes ────────────────────────────────────────────────────────
# certbot uses bind mounts to ./data/certbot/{conf,www} — not named volumes —
# so deploy.sh's openssl bootstrap cert and the real Let's Encrypt cert are
# visible to both the nginx and certbot containers without extra coordination.
volumes:
  postgres-data:
    driver: local

# ── Networks ───────────────────────────────────────────────────────
# Internal bridge: all service traffic is isolated from the host network.
# postgres is never reachable from outside the Docker network.
networks:
  ciotx-internal:
    driver: bridge
