services:

  # ── ciotx API Server ───────────────────────────────────────────────
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - PORT=8080
      - LLM_API_KEY=${LLM_API_KEY}
      - MASTER_LICENSE_KEY=${MASTER_LICENSE_KEY}
    expose:
      - "8080"
    networks:
      - ciotx-internal
    # Allow in-flight scans to complete during graceful shutdown
    stop_grace_period: 90s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits:
          # A single scan can be CPU intensive (JSON parsing, string matching)
          # but should never consume more than 2 cores or 1GB RAM.
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 128M

  # ── Nginx Reverse Proxy (TLS termination, dynamic domain) ─────────
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Let's Encrypt certs — read-only for nginx
      - certbot-certs:/etc/letsencrypt:ro
      # ACME challenge webroot
      - certbot-webroot:/var/www/certbot
      # install.sh served statically
      - ./scripts/deploy.sh:/var/www/static/install.sh:ro
    networks:
      - ciotx-internal
    stop_grace_period: 30s
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  # ── Certbot (Let's Encrypt SSL — auto-renewal every 12h) ──────────
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - certbot-certs:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    # Checks every 12h; certbot only renews if expiry < 30 days
    entrypoint: >
      sh -c "trap exit TERM;
             while :; do
               certbot renew --webroot -w /var/www/certbot --quiet;
               sleep 12h & wait $${!};
             done"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M

# ── Volumes ────────────────────────────────────────────────────────
volumes:
  certbot-certs:
    driver: local
  certbot-webroot:
    driver: local

# ── Networks ───────────────────────────────────────────────────────
# Internal bridge: api ↔ nginx traffic is isolated from the host network.
# A user running Wireshark only ever sees TLS traffic to DOMAIN_NAME:443.
# The api container has no public port — completely invisible.
networks:
  ciotx-internal:
    driver: bridge
